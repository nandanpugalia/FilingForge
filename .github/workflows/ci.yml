name: CI

# Runs the test suites on every branch push and pull request, so a change can't
# merge with failing tests. The release workflow (release.yml) is separate and
# only fires on version tags. Tag pushes don't match `branches` below, so a
# release tag doesn't double-run CI.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  python:
    name: Python (engine + API) tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Verify release metadata is internally consistent
        run: |
          python scripts/test_check_release_version.py
          python scripts/check_release_version.py
      - name: Install engine + API
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,dev]"
      - name: Run pytest
        run: pytest -q

  desktop-bse:
    name: BSE client + sidecar (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install engine and desktop build dependencies
        run: python -m pip install -e ".[api,dev]" pyinstaller
      - name: Test BSE client and all consumers offline
        run: python -m pytest engine/tests/test_bse_client.py engine/tests/test_bse_impersonation.py engine/tests/test_resolver.py engine/tests/test_fetcher.py engine/tests/test_annual_reports.py engine/tests/test_sidecar_build.py
      - name: Build the native sidecar
        run: python sidecar/build_sidecar.py
      - name: Verify the frozen API starts with curl native libraries
        shell: python
        run: |
          import json, os, pathlib, socket, subprocess, time, urllib.request
          with socket.socket() as sock:
              sock.bind(("127.0.0.1", 0))
              port = sock.getsockname()[1]
          suffix = ".exe" if os.name == "nt" else ""
          executable = pathlib.Path("dist", "filingforge-api" + suffix).resolve()
          process = subprocess.Popen([str(executable)], env={**os.environ, "FF_PORT": str(port)})
          try:
              deadline = time.monotonic() + 45
              while time.monotonic() < deadline:
                  if process.poll() is not None:
                      raise RuntimeError(f"Sidecar exited: {process.returncode}")
                  try:
                      with urllib.request.urlopen(f"http://127.0.0.1:{port}/health", timeout=1) as reply:
                          assert json.load(reply)["status"] == "ok"
                      print("Frozen sidecar health passed")
                      break
                  except OSError:
                      time.sleep(0.25)
              else:
                  raise RuntimeError("Sidecar startup timed out")
          finally:
              process.terminate()
              process.wait(timeout=10)

  mcp:
    name: MCP server tests
    runs-on: ubuntu-latest
    # A separate job on purpose: mcp 2.x wants starlette >=1.0, which the
    # fastapi==0.115.5 the desktop API pins forbids. Installing both into one
    # environment breaks the API. Here the MCP server gets a clean env, so its
    # adapter tests actually run instead of skipping.
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install engine + MCP server
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[mcp]" pytest
      - name: Run MCP tests
        run: pytest mcp_server/tests -q

  ui:
    name: UI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Install UI deps
        working-directory: ui
        run: npm ci
      - name: Lint UI
        working-directory: ui
        run: npm run lint
      - name: Typecheck + build UI
        working-directory: ui
        run: npm run build
      - name: Run vitest
        working-directory: ui
        run: npm test
