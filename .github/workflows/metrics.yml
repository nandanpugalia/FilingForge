name: Metrics → Discord

# Posts FilingForge stats to Discord twice a day + a weekly trend graph on Mondays.
# Privacy-clean: counts come from GitHub (downloads, stars, issues) — no app telemetry.
# Scheduled workflows run from the DEFAULT branch, so this activates once merged to main.
# Needs repo secret: DISCORD_WEBHOOK. Uses the built-in GITHUB_TOKEN for stats.

on:
  schedule:
    - cron: "30 3 * * *"    # ~09:00 IST — morning
    - cron: "30 13 * * *"   # ~19:00 IST — evening
    - cron: "0 4 * * 1"     # ~09:30 IST Monday — weekly trend graph
  workflow_dispatch:
    inputs:
      mode:
        description: "daily or weekly"
        default: "daily"

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # to commit the snapshot/history back
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Post metrics to Discord
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GH_REPO: ${{ github.repository }}
        run: |
          # weekly on the Monday cron or when dispatched with mode=weekly; daily otherwise
          if [ "${{ github.event.schedule }}" = "0 4 * * 1" ] || [ "${{ inputs.mode }}" = "weekly" ]; then
            python scripts/discord_metrics.py --weekly
          else
            python scripts/discord_metrics.py
          fi

      - name: Save snapshot/history
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add metrics/state.json metrics/history.jsonl 2>/dev/null || true
          git diff --cached --quiet || git commit -m "metrics: update snapshot [skip ci]"
          git push || true
