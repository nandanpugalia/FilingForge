[project]
name = "filingforge-engine"
version = "0.1.0"
description = "FilingForge engine — Indian company filings → clean, AI-ready local library."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["httpx==0.27.2", "pypdf==4.3.1"]

[project.optional-dependencies]
api = ["fastapi==0.115.5", "uvicorn[standard]==0.32.1"]
dev = ["pytest==8.3.3", "fastapi==0.115.5", "uvicorn[standard]==0.32.1"]

[tool.setuptools.packages.find]
include = ["engine*", "api*"]

[tool.pytest.ini_options]
testpaths = ["engine/tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
